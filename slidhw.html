
<!DOCTYPE html>
<html>
<head>
    <title>Image Slider Demo - Interactive Web Gallery</title>
    
</head>
<body>
<section>
    <img class="mySlides" src="OIP (3).webp" alt="Sorry, this picture hasn't loaded correctly. Retry." style="height: 500px; width: 500.68px;">
    <img class="mySlides" src="roblox-memes-17-1152x648.jpg" alt="Sorry, this picture hasn't loaded correctly. Retry." style="height: 500px; width: 500.68px;">
</section>
<script>
// Automatic Slideshow - change image every 3 secondsz
var myIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  myIndex++;
  if (myIndex > x.length) { myIndex = 1 }
  x[myIndex - 1].style.display = "block";
  setTimeout(carousel, 3000);
}
</script>
}
</script>
</body>
</html>
