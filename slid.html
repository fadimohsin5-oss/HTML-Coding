<!DOCTYPE html>
<html>
<head>
    <title>Slider in a website</title>
    
</head>
<body>
<section>
    <img class="mySlides" src="OIP (3).webp" alt="Sorry, this picture hasn't loaded correctly. Retry." style="height: 500px;width: 500.677777777777777777777777777777777777px;">
        <img class="mySlides" src="roblox-memes-17-1152x648.jpg"
            alt="Sorry, this picture hasn't loaded correctly. Retry." style="height: 500px; width: 500.677777777777777777777777777777777777px;">
</section>
<script>
    var myIndex =0;
    carousel();

    function carousel() {
        var i;
        var x = document.getElementsByClassName("mySlides");
        for (i = 0; i < x.length; i++) {
            x[i].style.display = "none";                                                                                                                                                                                                                        
        }
        myIndex++;
        if (myIndex > x.length) {myIndex = 1}
        x[myIndex-1].style.display = "block";
        setTimeout(carousel, 1500);
    }
</script>
</body>
</html>
