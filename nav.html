<!DOCTYPE html>
<html>
<head>
<title>Navbar</title>
<style>
    body {

    .topnav {
        overflow: hidden;
        background-color: rgba(255, 0, 0, 0.596);

    .topnav a{
        float:left;
        color: rgb(10, 130, 211);

        .topnav a.active {

color: black;
        }
</style>
</head>
