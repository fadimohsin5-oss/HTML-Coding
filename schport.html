<!DOCTYPE html>
<html>
<head>
  <title>My Portfolio</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
    }

    nav {
      background: black;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
    }

    section {
      padding: 50px;
      text-align: center;
    }

    #hero { background: lightblue; }
    #about { background: lightgreen; }
    #achievements { background: plum; }
    #projects { background: lightyellow; }
    #contact { background: pink; }

    button {
      padding: 10px;
      margin: 5px;
      cursor: pointer;
    }
  </style>

</head>

<body>

<!-- NAVBAR -->
<nav>
  <a href="#hero">Home</a>
  <a href="#about">About</a>
  <a href="#achievements">Achievements</a>
  <a href="#projects">Projects</a>
  <a href="#contact">Contact</a>
</nav>

<!-- HERO -->
<section id="hero">
  <h1>Hi! I'm Fahad</h1>
  <p>I love Computing</p>
</section>

<!-- ABOUT -->
<section id="about">
  <h2>About Me</h2>
  <p>I go to HHS and study coding at Codingal.</p>
</section>

<!-- ACHIEVEMENTS -->
<section id="achievements">
  <h2>My Achievements</h2>
  <p>🏆 2023 HHS Computing Award</p>
  <p>🎯 New Laptop</p>
  <p>🎓 Top Set in Maths and English</p>
</section>

<!-- PROJECTS -->
<section id="projects">
  <h2>My Projects</h2>

  <button onclick="showProject('You')">Project 1</button>
  <button onclick="showProject('ROCK')">Project 2</button>
  <button onclick="showProject('and cook')">Project 3</button>

  <p id="message"></p>
</section>

<!-- CONTACT -->
<section id="contact">
  <h2>Contact Me</h2>

  <form id="form">
    <input type="text" placeholder="Your name" required><br><br>
    <input type="email" placeholder="Your email" required><br><br>
    <textarea placeholder="Your message" required></textarea><br><br>
    <button type="submit">Send</button>
  </form>

  <p id="sent"></p>
</section>

<script>
  function showProject(name) {
    document.getElementById("message").textContent =
      "You clicked: " + name;
  }

  document.getElementById("form").onsubmit = function(e) {
    e.preventDefault();
    document.getElementById("sent").textContent = "Message sent!";
  };
</script>

</body>
</html>
