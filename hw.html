<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Using Functions</title>
</head>

<body>

<h1>Multiplication Using Functions</h1>
<p>In this project, you will be performing simple multiplication operations by using functions and parameters.</p>

<script>
    // Function expression that multiplies two numbers
    const multiply = function(num1, num2) {
        return num1 * num2;
    };

    // Store returned value in a variable
    let result = multiply(5, 4);

    // Print the value
    document.write("The result is: " + result);
</script>

</body>
</html>
