<!DOCTYPE html>
<html>
<head>
  <title>Website</title>

  <style>
    body, html{
      height:100%;
      margin:0;
      font-size:16px;
      font-family:"Lato", sans-serif;
      line-height:1.8em;
      color:#666;
      background-color:#b6f8ef;
    }

    .topnav {
      background-color:#333;
      padding:10px;
      text-align:center;
    }

    .topnav a {
      color:#1affa3;
      padding:14px 16px;
      text-decoration:none;
    }

    .topnav a:hover {
      background-color:#111;
    }

    .section {
      text-align:center;
      padding:50px;
    }

    .section-dark{
      background-color:#282e34;
      color:#ddd;
    }

    .mySlides {
      display:none;
      width:100%;
      height:500px;
      object-fit:cover;
    }
  </style>

</head>

<body>

  <div class="topnav">
    <a href="#">Home</a>
    <a href="#">About-Me</a>
    <a href="#">Gallery</a>
    <a href="#">Contact-Us</a>
  </div>

  <h1 style="text-align:center;">Welcome all to this website</h1>

  <section class="section section-dark">
    <h2>Section One</h2>
    <p>
      Web development is the work involved in developing a Web site for the Internet.
    </p>
  </section>

  <!-- Slideshow -->
  <section>
    <img class="mySlides" src="image1.jpg">
    <img class="mySlides" src="image2.jpg">
    <img class="mySlides" src="image3.jpg">
  </section>

  <section class="section section-dark">
    <p>© All rights reserved by Fahad</p>
  </section>

  <script>
    var myIndex = 0;
    carousel();

    function carousel() {
      var i;
      var x = document.getElementsByClassName("mySlides");

      for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";
      }

      myIndex++;
      if (myIndex > x.length) { myIndex = 1 }

      x[myIndex - 1].style.display = "block";
      setTimeout(carousel, 3000);
    }
  </script>

</body>
</html>
