<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<section class="py-5" style="background-color: bisque;" id="contact">
    <div class="container">
        <h2 class="fw-bold text-centre mb-4">
Contact Me
        </h2>
        <div class="row justify-content-centre">
            <div class="col-md-6">
<form id="contactForm" action="https://formspree.io/f/xaqlpyeq" method="post">
    <input class="form-control mb-3" name="name" placeholder="Enter your name" required>
        <input class="form-control mb-3" name="email" placeholder="Enter your email" type="email" required>
        <textarea class="form-control mb-3" name="message" rows="3" placeholder="Your message" required></textarea>
        <button class="btn btn-sucess w-100 fw-bold" type="submit">
Send Message 💬
        </button>
</form>
<div class="alert alert-success mt-3 d-none" id="sentOk">
Message sent✅
</div>
<div class="alert alert-danger mt-3 d-none" id="sentFail">
    Oops! Try again❌
</div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="portfoliojs.js"></script>
</body>
</html>
