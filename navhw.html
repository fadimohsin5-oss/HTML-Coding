<!DOCTYPE html>
<html>
<head>
    <title>NavBar Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f7f5;
        }

        /* Navbar */
        .topnav {
            background-color: #6ca6a6;
            overflow: hidden;
        }

        .topnav a {
            float: left;
            color: white;
            text-align: center;
            padding: 12px 16px;
            text-decoration: none;
            font-size: 16px;
        }

        .topnav a:hover {
            background-color: #a8d5d5;
            color: black;
        }

        .topnav a.active {
            background-color: #4d8c8c;
        }

        /* Page content */
        .content {
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #4d8c8c;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <div class="topnav">
        <a class="active" href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </div>

    <!-- Content -->
    <div class="content">
        <h1>Welcome 🌿</h1>
        <p>This is my website project.</p>
        <p>I made a simple navigation bar and soft colours.</p>
    </div>

</body>
</html>
